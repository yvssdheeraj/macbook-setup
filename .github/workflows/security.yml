name: Security Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-audit:
    name: Security & Policy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for sudo/root usage
        run: |
          # Allow sudo string in comments or echo/log/fatal messages, but not actual command usage
          # For a basic check, we'll exclude our known safe use in preflight.sh
          if grep -rnw scripts setup.sh uninstall.sh --exclude=preflight.sh -e 'sudo '; then
            echo "::error::Found usage of 'sudo'. Sudo is strictly prohibited in this repository."
            exit 1
          fi
          echo "No sudo usage found."
